<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>YouTube Window Presets の設定</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header class="page-head">
        <h1>YouTube Window Presets</h1>
        <div class="io">
          <button type="button" id="export" class="button">エクスポート</button>
          <button type="button" id="import" class="button">インポート</button>
          <input type="file" id="importFile" accept=".json,application/json" hidden />
        </div>
      </header>
      <div class="export-target">
        <label for="exportFileName">エクスポート先:</label>
        <span id="exportDir">(フォルダは初回に選びます)</span><span class="export-sep">/</span>
        <input type="text" id="exportFileName" class="export-name" spellcheck="false" autocomplete="off" />
        <button type="button" id="changeExportTarget" class="link">フォルダを変更</button>
      </div>
      <p id="message" class="message"></p>
      <div id="presets"></div>
      <p class="empty" id="empty">まだ設定がありません。</p>
    </main>
    <template id="preset">
      <section class="preset">
        <div class="head">
          <span class="grip" title="ドラッグで並べ替え(上ほど優先)" aria-label="並べ替え">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="9" cy="6" r="1.6" /><circle cx="15" cy="6" r="1.6" />
              <circle cx="9" cy="12" r="1.6" /><circle cx="15" cy="12" r="1.6" />
              <circle cx="9" cy="18" r="1.6" /><circle cx="15" cy="18" r="1.6" />
            </svg>
          </span>
          <input type="text" class="name" aria-label="名前" />
          <label class="default-toggle" title="YouTube の配信の映像が縦長(高さが幅より大きい)なら、この設定を当てる">
            縦長の配信
            <span class="switch"><input type="checkbox" class="portrait" /><span class="slider"></span></span>
          </label>
          <label class="default-toggle" title="どの設定にも当たらない YouTube の配信で使う">
            デフォルトを有効
            <span class="switch"><input type="checkbox" class="is-default" /><span class="slider"></span></span>
          </label>
          <button type="button" class="icon-btn danger delete" title="削除" aria-label="削除"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>
        </div>
        <div class="bounds">
          <label>幅 <input type="number" data-key="width" /></label>
          <label>高さ <input type="number" data-key="height" /></label>
          <label>左 <input type="number" data-key="left" /></label>
          <label>上 <input type="number" data-key="top" /></label>
        </div>
        <label class="caption">URL(1行に1つ)</label>
        <textarea class="urls" rows="3" spellcheck="false" placeholder="例: https://www.youtube.com/@channel/live"></textarea>
        <label class="caption">YouTube の配信のタイトルに含まれるキーワード(1行に1つ)</label>
        <textarea class="keywords" rows="3" spellcheck="false" placeholder="例: #縦型配信"></textarea>
      </section>
    </template>
    <script type="module" src="options.js"></script>
  </body>
</html>
